<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }

        ol{
            background-color: purple;
            height: 300px ;
            padding: 20px  0px;
            border: 2px solid green;
            display:flex ;
            justify-content: space-evenly ;
            align-items: center;
            flex-direction: row;
            list-style: none;
            flex-wrap: wrap-reverse;

        }
        li{
            font-weight: bold;
            color: blue;
            font-style: italic;
            text-shadow: 2px 2px 2px black;
            background-color: burlywood;
            padding: 10px ;
            border-radius: 8px;
            flex-grow: 1;
            margin: 10px 30px;
            text-align: center;
        
        #electronic-devices{
            border: 4px solid red;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            align-items: center;
            position: relative;
            bottom: 150px;
            backdrop-filter: blur(20px);
        }
        #electronic-devices>div{
            height: 450px;
            width: 350px;
            border: 5px solid green;
            margin: 20px;
        }
        h1{
            position: relative;
            top: 150px;
            left: 500px;
            backdrop-filter: blur(10px);
            text-shadow: 4px 4px 4px aliceblue;
            padding: 10px 30px;
            border-radius: 10px;
            box-shadow: 5px 5px 5px black;
        }
    </style>
</head>
<body>
    <nav>
        <ol>
            <li>HOME</li>
            <li>ABOUT</li>
            <li>CONTACT</li>
            <li>HELP</li>
            <li>LOGIN</li>
        </ol>
    </nav>
    <main>
        <section id="background-video">
             <video autoplay muted loop>
            <source src="./ugadhi.mp4" type="video/mp4"></source>
        </section>
        <section>
            <h1>Welcome to Alpha Mart</h1>
        </section>

</head>
