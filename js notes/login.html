<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <fieldset>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <br><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <br><br>
            <button type="submit">Submit</button>
            <button type="reset">Cancel</button>
        </fieldset>
    </form>

    <script>
        let uName = document.getElementById("username");
        let psw= document.getElementById("password");
        let form = document.querySelector("form");

        form.addEventListener("submit", (e) => {
            e.preventDefault() 
            console.log("Username: " , uName.value);
            console.log("Password: " , psw.value);
            window.localStorage.setItem("username", uName.value);
            window.localStorage.setItem("password", psw.value);
            //localStorage.setItem() is used to store data in local storage in key value formate
            //this local storage permanen storage because data not delete even browser close
            window.localStorage.setItem("username",uName.value)
            window.localStorage.setItem("password",psw.value)

            let storedUsername = window.localStorage.getItem("Username");
            let storedPassword = window.localStorage.getItem("Password");
            console.log("Stored UseName:" + storedUsername);
            console.log("Stored Password:" + storedPassword);
            
        });
    </script>

    
</body>
</html>
