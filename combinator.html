<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ol+h1{
            background-color: rgb(83, 120, 189);
            color: rgb(97, 12, 177);
        }    
        h4>p{
            background-color: yellowgreen;

        }
        ol>li{
            margin: 20px;
            background-color: aqua;
        }
        ul p{
            background-color: rgb(226, 22, 22);
        }
        ol~h1{
            background-color: cadetblue;
        }

    </style>
</head>

        <li>List-1</li>
        <li>List-2</li>
        <li>List-3</li>
        <li>List-4</li>
    </ol>
    <h1>unorder list</h1>
    <ul>
        <li>
            <p>This is paragraph present in understand</p>
        </li>
        <li>unordered list items</li>
        <li>unordered list items</li>
        <li>unordered list items</li>
    </ul>
    <h1> Heading in 3rd position</h1>

        <h4>
            <p>Heading 4</p>
        </h4>
            
    
    </h3>

</html>
